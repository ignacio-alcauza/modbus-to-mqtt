services:
  modbus-bridge:
    build: .
    image: modbus-to-mqtt-bridge
    container_name: modbus-to-mqtt-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./logs:/app/logs
    # For Home Assistant MQTT auto-discovery or local network access
    network_mode: "host" 
    healthcheck:
      test: ["CMD", "python", "src/main.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
