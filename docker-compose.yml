services:
  modbus-bridge:
    build: .
    container_name: modbus-to-mqtt
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./logs:/app/logs
    # For Home Assistant MQTT auto-discovery or local network access
    network_mode: "host" 
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -1 | grep . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
