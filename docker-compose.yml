services:
  modbus-bridge:
    build: .
    container_name: modbus-to-mqtt
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./logs:/app/logs
    # For Home Assistant MQTT auto-discovery or local network access
    network_mode: "host" 
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(($(date +%s) - $(cat /tmp/heartbeat))) -lt 120 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
